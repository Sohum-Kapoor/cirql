[project]
name = "cirql"
version = "0.1.0"
description = "Cirql — agents walk your network. JacHacks UMich 2026."
entry-point = "main.jac"
kind = "fullstack"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
# UI kit (SOH-165): jac-shadcn primitives in components/ui + Linear-style tokens in assets/main.css
clsx = "^2.1.1"
tailwind-merge = "^3.7.0"
class-variance-authority = "^0.7.1"
radix-ui = "^1.6.7"
"@fontsource-variable/inter" = "^5.3.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
tailwindcss = "^4.3.3"
"@tailwindcss/vite" = "^4.3.3"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[plugins.client.app_meta_data]
# Served <head> (SOH-206): tab title (color-scheme lives in assets/main.css;
# jac-client writes meta content unquoted, so any value with a space breaks — title only).
title = "Cirql"

[plugins.client.mobile]
# Capacitor iOS shell (SOH-174). Set app_id BEFORE `jac setup mobile` (it is baked
# into the Xcode project). The backend URL is NOT here: scripts/ios_build.sh passes
# it as JAC_CLIENT_API_BASE_URL at build time (the tunnel URL changes).
app_name = "Cirql"
app_id = "com.jessechang.cirql"
default_platform = "ios"
ios_sdk = "iphonesimulator"
ios_destination = "platform=iOS Simulator,name=iPhone 16,OS=latest"

[plugins.scale.microservices]
# One process. Without this, jac-scale auto-detects every `sv import` target as a
# separate microservice and spawns subprocesses that never become healthy.
enabled = false

[plugins.scale.jwt]
# Never ship the default signing secret (anyone could forge tokens). The host sets
# JWT_SECRET in its .env; the fallback keeps local `jac start` working.
secret = "${JWT_SECRET:-dev-only-secret-change-me-on-any-host}"

[plugins.byllm.model]
# Gemini via byLLM (GOOGLE_API_KEY in .env).
# Verified 2026-09-26 14:58 via `jac run` hello (SOH-161): 2.0/2.5 models are retired on
# this key; gemini-3.8-flash answers. `jac run` auto-loads .env from cwd.
default_model = "gemini/gemini-3.8-flash"
