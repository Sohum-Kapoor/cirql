[project]
name = "cirql"
version = "0.1.0"
description = "Cirql — agents walk your network. JacHacks UMich 2026."
entry-point = "main.jac"
kind = "fullstack"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
# UI kit (SOH-165): jac-shadcn primitives in components/ui + Linear-style tokens in assets/main.css
clsx = "^2.1.1"
tailwind-merge = "^3.7.0"
class-variance-authority = "^0.7.1"
radix-ui = "^1.6.7"
"@fontsource-variable/inter" = "^5.3.0"
# Force-directed graph view (SOH-185): d3-force/zoom/drag/selection, driven from components/graph/GraphView.cl.jac
d3 = "^7.9.0"
# Public card QR (SOH-228): components/card/CardQR.cl.jac. Added by hand per
# AGENTS.md gotcha — `jac add --npm` rewrites this whole file and drops comments.
"qrcode.react" = "^4.2.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
tailwindcss = "^4.3.3"
"@tailwindcss/vite" = "^4.3.3"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[plugins.client]

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[plugins.client.app_meta_data]
# Served <head> (SOH-206): tab title (color-scheme lives in assets/main.css;
# jac-client writes meta content unquoted, so any value with a space breaks — no spaces).
title = "Cirql"
# SOH-226: files in assets/ are served at /static/<path> (jaclang server.impl static branch).
theme_color = "#0E1018"
icon = "/static/icon/icon-32.png"
apple_touch_icon = "/static/icon/icon-180.png"
manifest = "/static/manifest.webmanifest"

[plugins.client.mobile]
# Capacitor iOS shell (SOH-174). Set app_id BEFORE `jac setup mobile` (it is baked
# into the Xcode project). The backend URL is NOT here: scripts/ios_build.sh passes
# it as JAC_CLIENT_API_BASE_URL at build time (the tunnel URL changes).
app_name = "Cirql"
app_id = "com.jessechang.cirql"
default_platform = "ios"
ios_sdk = "iphonesimulator"
ios_destination = "platform=iOS Simulator,name=iPhone 16,OS=latest"

[plugins.scale.microservices]
# One process. Without this, jac-scale auto-detects every `sv import` target as a
# separate microservice and spawns subprocesses that never become healthy.
enabled = false

[plugins.scale.jwt]
# Never ship the default signing secret (anyone could forge tokens). The host sets
# JWT_SECRET in its .env; the fallback keeps local `jac start` working.
secret = "${JWT_SECRET:-dev-only-secret-change-me-on-any-host}"

[plugins.scale.sso.google]
# SOH-237. `jac-sv-auth` names client_id/client_secret; the redirect URI for the
# Google Cloud Console's OAuth client is <host>/sso/google/callback (not
# guide-confirmed by name - verify in the server log on first real login, since
# jac-scale/jaseci aren't installed in this client-only .venv to check against).
# `:-` defaults keep an unset var from breaking `jac start`; AuthCard.cl.jac
# probes `/sso/google/login` on mount and hides the button while these are empty.
client_id = "${GOOGLE_OAUTH_CLIENT_ID:-}"
client_secret = "${GOOGLE_OAUTH_CLIENT_SECRET:-}"

[plugins.scale.sso.apple]
# Sign in with Apple has no client_secret; Apple's console wants team_id + key_id
# + the private key for the associated Services ID to mint one. Key NAMES here
# are inferred from that flow, not guide-confirmed (same caveat as above) -
# verify against jac-scale's actual config schema before relying on this in prod.
# Redirect URI for the Apple Developer "Return URLs" field: <host>/sso/apple/callback.
client_id = "${APPLE_SSO_CLIENT_ID:-}"
team_id = "${APPLE_SSO_TEAM_ID:-}"
key_id = "${APPLE_SSO_KEY_ID:-}"
private_key = "${APPLE_SSO_PRIVATE_KEY:-}"

[plugins.byllm.model]
# Gemini via byLLM (GOOGLE_API_KEY in .env).
# Verified 2026-09-26 14:58 via `jac run` hello (SOH-161): 2.0/2.5 models are retired on
# this key; gemini-3.8-flash answers. `jac run` auto-loads .env from cwd.
default_model = "gemini/gemini-3.8-flash"
